<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Inicial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="titulo">
        <H1> Souvenir list</H1>
    </div>
    <form action="">
        <div class="div-row">
            <label for="lista" style="font-size: 24px;"><strong>Nova Lista: </strong></label>
            <input type="text" id="lista" name="lista" required >
        </div>
        <br>
        <label for="nome-obra">Nome da obra:</label>
        <input type="text" id="nome-obra" name="nome-obra" required>
        <br>
        <div class="div-forms">
            <div class="div-row">
                <label for="historia">História:</label>
                <select name="historia" id="historia">
                    <option value="">Muito bom</option>
                    <option value="">Bom</option>
                    <option value="">Mediano</option>
                    <option value="">Ruim</option>
                    <option value="">Muito ruim</option>
                </select>
            </div>

            <div class="div-row">
                <label for="arte">Direção de arte:</label>
                <select name="arte" id="arte">
                    <option value="">Muito bom</option>
                    <option value="">Bom</option>
                    <option value="">Mediano</option>
                    <option value="">Ruim</option>
                    <option value="">Muito ruim</option>
                </select>
            </div>

            <div class="div-row">
                <label for="constancia">Constância:</label>
                <select name="constancia" id="constancia">
                    <option value="">Muito bom</option>
                    <option value="">Bom</option>
                    <option value="">Mediano</option>
                    <option value="">Ruim</option>
                    <option value="">Muito ruim</option>
                </select>
            </div>

            <div class="div-row">
                <label for="trilha-sonora">Trilha sonora:</label>
                <select name="trilha-sonora" id="trilha-sonora">
                    <option value="">Muito bom</option>
                    <option value="">Bom</option>
                    <option value="">Mediano</option>
                    <option value="">Ruim</option>
                    <option value="">Muito ruim</option>
                </select>
            </div>

            <div class="div-row">
                <label for="avaliacao">Avaliação:</label>
                <select name="trilha-sonora" id="trilha-sonora">
                    <option value="">5</option>
                    <option value="">4</option>
                    <option value="">3</option>
                    <option value="">2</option>
                    <option value="">1</option>
                </select>
            </div>
            <br>
            <button>Concluir</button>
        </div>
    </form>
    <br>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
            </tr>
            <tr>
                <th>História</th>
                <th>Direção de arte</th>
                <th>Constância</th>
                <th>Trilha sonora</th>
                <th>Avaliação</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    <br>
    <hr>
    <h2>Listas Criadas</h2>
    <script src="script.js"></script>
</body>
</html>
